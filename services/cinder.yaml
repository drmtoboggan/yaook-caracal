apiVersion: yaook.cloud/v1
kind: CinderDeployment
metadata:
  name: cinder
  namespace: openstack
spec:
  targetRelease: "2024.1"
  
  region:
    name: RegionOne
  
  keystoneRef:
    name: keystone
  
  issuerRef:
    name: ca-issuer
  
  database:
    replicas: 1
    storageClassName: longhorn
    storageSize: 8Gi
    timeoutClient: 300
    proxy:
      replicas: 1
    backup:
      schedule: "0 * * * *"
  
  messageQueue:
    replicas: 1
    resources:
      rabbitmq:
        limits:
          memory: 1G
          cpu: 1000m
  
  memcached:
    replicas: 1
    memory: 1024
    connections: 2000
  
  api:
    replicas: 1
    ingress:
      fqdn: "cinder.region.com"
      port: 443
      ingressClassName: nginx
  
  scheduler:
    replicas: 1
  
  cinderConfig:
    DEFAULT:
      debug: false
    database:
      connection_recycle_time: 280
  
  backends:
    ceph:
      volume:
        replicas: 1
      rbd:
        keyringReference: ceph-client-cinder-key
        keyringUsername: cinder
        cephConfig:
          global:
            fsid: ad9e8f76-3aae-11f0-9498-0fcbb987ca56
            mon_host: '[v2:10.10.28.10:3300/0,v1:10.10.28.10:6789/0],[v2:10.10.28.6:3300/0,v1:10.10.28.6:6789/0],[v2:10.10.28.7:3300/0,v1:10.10.28.7:6789/0],[v2:10.10.28.8:3300/0,v1:10.10.28.8:6789/0]'
        backendConfig:
          volume_backend_name: ceph
          rbd_pool: cinder.volumes
          rbd_flatten_volume_from_snapshot: false
          rbd_max_clone_depth: 5
  
  backup:
    ceph-backup:
      replicas: 1
      cinderConfig:
        DEFAULT:
          backup_driver: cinder.backup.drivers.ceph.CephBackupDriver
          backup_ceph_pool: cinder.backups
          backup_ceph_chunk_size: 134217728
          backup_ceph_user: cinder-backup
  
  databaseCleanup:
    schedule: "0 0 * * *"
    deletionTimeRange: 60
